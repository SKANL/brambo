name: Sandbox host conformance

on:
  workflow_dispatch:
    inputs:
      run-real-host-conformance:
        description: Run the real-host sandbox conformance suite.
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/sandbox-conformance.yml'
      - 'packages/contracts/src/sandbox.ts'
      - 'packages/contracts/test/sandbox.test.ts'
      - 'packages/sandbox/**'
      - 'packages/sandbox-local/**'
      - 'scripts/run-linux-conformance-podman.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandbox-conformance.yml'
      - 'packages/contracts/src/sandbox.ts'
      - 'packages/contracts/test/sandbox.test.ts'
      - 'packages/sandbox/**'
      - 'packages/sandbox-local/**'
      - 'scripts/run-linux-conformance-podman.ps1'

# This workflow remains opt-in for manual dispatch, while relevant source
# changes also run the real-host matrix automatically. A false manual input is
# still a deliberate non-claim; explicit runs must fail if a suite is missing.
permissions:
  contents: read

jobs:
  host-conformance:
    if: inputs.run-real-host-conformance || github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PANDA_RUN_SANDBOX_CONFORMANCE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux sandbox substrate
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap systemd uidmap
          # Do not substitute --unshare-user-try: a missing user namespace
          # must fail the real-host conformance run, not weaken its boundary.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w user.max_user_namespaces=15000
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Require matching host and declared substrate
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            linux) test "$RUNNER_OS" = Linux; command -v bwrap; command -v systemd-run ;;
            macos) test "$RUNNER_OS" = macOS; command -v sandbox-exec ;;
          esac
      - name: Require real-host conformance clause
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conformance-results
          # Presence is only admission. The suite must prove enforcement;
          # discovery-only providers are not an acceptable substitute.
          guard_suite="packages/sandbox-local/test/host-conformance/${{ matrix.platform }}.test.ts"
          execution_suite="test/host-conformance/${{ matrix.platform }}.test.ts"
          test -f "$guard_suite" || {
            echo "Missing real-host conformance suite: $guard_suite" >&2
            echo "Discovery-only providers cannot be reported as fully enforced." >&2
            exit 1
          }
          pnpm --filter @skanl/panda-sandbox-local exec vitest run "$execution_suite" 2>&1 | tee "conformance-results/${{ matrix.platform }}.log"
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-conformance-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}
          path: conformance-results/
          if-no-files-found: warn
