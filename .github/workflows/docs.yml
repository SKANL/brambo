name: Documentation
on:
  push: {branches: [main], paths: ['docs-site/**', 'README.md', 'packages/*/README.md', 'packages/*/src/**', '*.md', '*.cff', '.github/**', 'scripts/generate-api-docs.mjs', 'scripts/validate-*.mjs', 'typedoc.json', 'package.json', 'pnpm-lock.yaml']}
  pull_request: {paths: ['docs-site/**', 'README.md', 'packages/*/README.md', 'packages/*/src/**', '*.md', '*.cff', '.github/**', 'scripts/generate-api-docs.mjs', 'scripts/validate-*.mjs', 'typedoc.json', 'package.json', 'pnpm-lock.yaml']}
permissions: {contents: read}
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {version: 11.23.0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.0
