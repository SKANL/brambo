name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The single required PR gate is intentionally small and deterministic.
  # Source and packed-consumer compatibility matrices also qualify PRs before merge.
  required:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.19.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Check (typecheck + test + lint)
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Consumer-install proof
        run: pnpm proof:consumer-install

  coordinator-process:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.19.0', cache: pnpm}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify SQLite capability (multi-device tests must not skip)
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import { DatabaseSync } from 'node:sqlite'; const [major, minor] = process.versions.node.split('.').map(Number); assert(major > 24 || major === 24 && minor >= 15); const db = new DatabaseSync(':memory:'); db.close();"
      - name: Coordinator worker and multi-device tests
        run: pnpm --filter @brambodev/workflow-coordinator test test/worker.test.ts test/multi-device.test.ts

  gates:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: ${{ matrix.node-version == '26' }}
    strategy:
      fail-fast: false
      matrix:
        # These are source/developer validation runtimes. The root toolchain
        # floor remains >=24. Node 22 validates compatible source suites and
        # SQLite refusal; >=24.15 validates every suite, including persistence.
        # Keep the exact SQLite floor and the TypeScript-stripping Node 22 floor.
        node-version: ['22.18.0', '22', '24.15.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check runtime capabilities (typecheck + test + lint)
        run: node scripts/ci-runtime-check.mjs
      - name: Build
        run: pnpm build
      # Build once on the supported toolchain, then test only the packed
      # artifacts on candidate consumer runtimes. The consumer job does not
      # install pnpm or load repository source files.
      - name: FR-29 consumer-install proof
        run: pnpm proof:consumer-install

  build-pack:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack publishable tarballs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-publishable.mjs "$RUNNER_TEMP/brambo-tarballs"
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/brambo-tarballs/artifact-identity.txt"
      - name: Upload packed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brambo-publishable-tarballs-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/brambo-tarballs
          if-no-files-found: error

  consumer-floor:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22.13.0', '22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download packed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brambo-publishable-tarballs-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/brambo-tarballs
      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n '1p' "$RUNNER_TEMP/brambo-tarballs/artifact-identity.txt")" = "$GITHUB_SHA"
          test "$(sed -n '2p' "$RUNNER_TEMP/brambo-tarballs/artifact-identity.txt")" = "$GITHUB_RUN_ID"
      - name: Run plain Node consumer smoke
        shell: bash
        env:
          npm_config_engine_strict: 'false'
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/brambo-tarballs"
