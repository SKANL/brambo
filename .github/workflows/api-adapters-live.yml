name: API adapter live evidence

# Only the default-branch schedule or a confirmed default-branch dispatch may access credentials.
on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to authorize billed OpenAI and Anthropic API requests'
        required: true
        type: string
      openai_model:
        description: 'Explicit OpenAI model ID enabled for this key'
        required: true
        type: string
      anthropic_model:
        description: 'Explicit Anthropic model ID enabled for this key'
        required: true
        type: string

permissions:
  contents: read

jobs:
  live:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: api-adapters-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Bounded OpenAI and Anthropic live suites
        env:
          BRAMBO_RUN_LIVE_API_TESTS: '1'
          BRAMBO_LIVE_API_MAX_REQUESTS: '4'
          BRAMBO_LIVE_API_TIMEOUT_MS: '30000'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ github.event_name == 'schedule' && vars.OPENAI_LIVE_MODEL || inputs.openai_model }}
          ANTHROPIC_MODEL: ${{ github.event_name == 'schedule' && vars.ANTHROPIC_LIVE_MODEL || inputs.anthropic_model }}
        run: pnpm test:api-live
