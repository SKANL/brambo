name: Changesets
on:
  push: {branches: [main]}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {version: 11.23.0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@72b60a2c449090fd1871c5578768a32a76011a9d # v2.1.0
        with:
          version-script: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release tag for the versioned workspace
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/contracts/package.json').version")"
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'
          const expected = JSON.parse(readFileSync('packages/contracts/package.json', 'utf8')).version
          const mismatches = []
          for (const dir of readdirSync('packages', { withFileTypes: true })) {
            if (!dir.isDirectory()) continue
            try {
              const manifest = JSON.parse(readFileSync(`packages/${dir.name}/package.json`, 'utf8'))
              if (manifest.private !== true && manifest.version !== expected) mismatches.push(`${manifest.name}: ${manifest.version}`)
            } catch {}
          }
          if (mismatches.length > 0) throw new Error(`publishable package versions disagree with ${expected}: ${mismatches.join(', ')}`)
          NODE
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "${tag}" --message "Release ${tag}" "$GITHUB_SHA"
          git push origin "${tag}"
