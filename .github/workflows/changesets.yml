name: Changesets
on:
  push: {branches: [main]}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {version: 11.23.0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release tag for the versioned workspace
        shell: bash
        run: |
          set -euo pipefail
          # Changesets leaves its generated release branch checked out. Only
          # immutable main-push objects may authorize release automation.
          decision="$(node scripts/release-version-guard.mjs "$GITHUB_SHA")"
          ready="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).ready))' "$decision")"
          if [ "$ready" = false ]; then
            echo "$decision"
            exit 0
          fi
          test "$ready" = true
          version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$decision")"
          tag="v$version"
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
          case "$tag_status" in
            0)
              git fetch --no-tags origin "refs/tags/$tag"
              existing="$(git rev-parse FETCH_HEAD)"
              node scripts/release-version-guard.mjs "$GITHUB_SHA" "$existing"
              exit 0
              ;;
            2) ;; # Confirmed absent, not a failed lookup.
            *) echo "Cannot verify existing release tag" >&2; exit "$tag_status" ;;
          esac
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "${tag}" --message "Release ${tag}" "$GITHUB_SHA"
          git push origin "${tag}"
          gh workflow run release.yml --ref "${tag}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
