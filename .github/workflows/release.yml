name: Release

# The tag is the trigger, but this job re-earns its green on the tagged commit
# before publishing. The existing workspace publish semantics are intentional:
# the packed tarballs are smoke-tested, while pnpm publish preserves its proven
# recursive publish/version ordering and registry retry behavior.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel a publish halfway through a package set. A later run waits and
  # the provenance assertion reports the registry's actual outcome.
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the tagged checkout is clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify documentation snapshots against release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          pnpm docs:validate-versions
      - name: Verify tagged commit descends from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck + test + lint)
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Pack publishable tarballs
        run: node scripts/pack-publishable.mjs "$RUNNER_TEMP/brambo-tarballs"
      - name: Plain Node consumer smoke
        env:
          npm_config_engine_strict: 'false'
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/brambo-tarballs"
      # This gate exercises the packed publishable surface outside the
      # repository before the irreversible publish step.
      - name: Consumer-install proof
        run: pnpm proof:consumer-install
      # The tag is the source of truth for the version. A mismatch stops here
      # rather than publishing a version nobody can reproduce from this commit.
      - name: The tag and the manifests agree
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/contracts/package.json').version")"
          test "$TAG" = "$VERSION"
      # Provenance is optional: npm trusted publishing must be configured by an
      # administrator before it can be enabled. The free token-based path is
      # kept reproducible and does not claim provenance it cannot prove.
      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          DIST_TAG="$(node scripts/dist-tag.mjs)"
          while IFS= read -r package_json; do
            package_name="$(node -p "require('./$package_json').name")"
            package_version="$(node -p "require('./$package_json').version")"
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "already published: $package_name@$package_version"
              continue
            fi
            pnpm --filter "$package_name" publish --access public --no-git-checks --report-summary --tag "$DIST_TAG"
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print | sort)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # This reads the registry rather than trusting the publish log, and runs
      # after partial failures so every package's outcome remains observable.
      - name: The published packages actually exist
        if: always()
        shell: bash
        run: node scripts/assert-published.mjs
      - name: Create GitHub Release with generated notes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to duplicate it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" CHANGELOG.md --repo "$GITHUB_REPOSITORY"
