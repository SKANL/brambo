name: Release

# The tag is the trigger, but this job re-earns its green on the tagged commit
# before publishing. The existing workspace publish semantics are intentional:
# the packed tarballs are smoke-tested, while pnpm publish preserves its proven
# recursive publish/version ordering and registry retry behavior.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel a publish halfway through a package set. A later run waits and
  # the provenance assertion reports the registry's actual outcome.
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tagged commit descends from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck + test + lint)
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Pack publishable tarballs
        run: node scripts/pack-publishable.mjs "$RUNNER_TEMP/panda-tarballs"
      - name: Plain Node consumer smoke
        env:
          npm_config_engine_strict: 'false'
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/panda-tarballs"
      # This gate exercises the packed publishable surface outside the
      # repository before the irreversible publish step.
      - name: Consumer-install proof
        run: pnpm proof:consumer-install
      # The tag is the source of truth for the version. A mismatch stops here
      # rather than publishing a version nobody can reproduce from this commit.
      - name: The tag and the manifests agree
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/contracts/package.json').version")"
          test "$TAG" = "$VERSION"
      # Keep the explicit provenance flag and the repository's version-aware
      # dist-tag classifier on the proven recursive publish command.
      - name: Publish with npm provenance
        shell: bash
        run: |
          set -euo pipefail
          DIST_TAG="$(node scripts/dist-tag.mjs)"
          pnpm publish -r --access public --no-git-checks --provenance --report-summary --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # This reads the registry rather than trusting the publish log, and runs
      # after partial failures so every package's outcome remains observable.
      - name: The published packages actually carry provenance
        if: always()
        shell: bash
        run: node scripts/assert-provenance.mjs
