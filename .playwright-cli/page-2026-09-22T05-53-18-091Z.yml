                    - /url: "#understand-enforcement"
                    - text: "#"
                - paragraph [ref=f5e126]: The default policy requests workspace write access and denies network access. Providers must prove requested capabilities with evidence; requests fail closed when evidence is missing. The local provider's evidence is conservative.
