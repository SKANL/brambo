                  - code [ref=f5e120]: createToolExecutor
                  - text: from
                  - code [ref=f5e121]: "@brambodev/session"
                  - text: . The host creates a sandbox session using a registered provider, binds its executor, then passes a validated invocation through the explicit execution path. Dispose the session at the host lifecycle boundary. This path is not automatically invoked by
                  - code [ref=f5e122]: runSession
                  - text: .
                - paragraph [ref=f5e123]: Supported invocation descriptors include exact-argv local processes, MCP over stdio, and MCP streamable HTTP. The API contract does not imply that a concrete remote transport is bundled; the remote provider requires an injected transport.
