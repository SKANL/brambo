            - paragraph [ref=f3e55]:
              - text: The SDK exposes
              - code [ref=f3e56]: executeTool
              - text: and
              - code [ref=f3e57]: createToolExecutor
              - text: from
              - code [ref=f3e58]: "@brambodev/session"
              - text: . The host creates a sandbox session using a registered provider, binds its executor, then passes a validated invocation through the explicit execution path. Dispose the session at the host lifecycle boundary. This path is not automatically invoked by
              - code [ref=f3e59]: runSession
              - text: .
            - paragraph [ref=f3e60]: Supported invocation descriptors include exact-argv local processes, MCP over stdio, and MCP streamable HTTP. The API contract does not imply that a concrete remote transport is bundled; the remote provider requires an injected transport.
            - heading [level=2] [ref=f3e61]:
              - text: Understand enforcement
              - link "Direct link to Understand enforcement" [ref=f3e62] [cursor=pointer]:
                - /url: "#understand-enforcement"
                - text: "#"
            - paragraph [ref=f3e63]: The default policy requests workspace write access and denies network access. Providers must prove requested capabilities with evidence; requests fail closed when evidence is missing. The local provider's evidence is conservative.
            - generic [ref=f3e64]:
              - generic [ref=f3e65]: No OS isolation claim
              - paragraph [ref=f3e70]: CLI executor adapters do not provide operating-system containment, and sandbox API types alone do not establish isolation.
